<!--  
1. Save your name in a variable inside script tag.
2. Display name from the variable on the page.
3. Calculate the cost of Myntra Bag and keep it in a variable.
  a. Jeans - Rs.4500 / Discount = 10 % / Coupon = 150
  b. Shirt - Rs.2000 / Discount = 15 % / Coupon = 250
4. Show it to console.
5. Use eval method from math to convert string calculation into result. -->

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="p1.css">
</head>
<body>

  <p id="a1"></p>
  
  <script>
    const name="Roger";
    document.querySelector('#a1').innerText=name;

    let cartTotal=Math.round( ((4500-(10/100*4500))-150) + ((2000-(15/100*2000)-250)) );
    console.log(cartTotal);
    console.log( eval('10*2-10+50') );  // eval method to convert string calculation into result.

    document.getElementById('a1').innerHTML='Total = '+cartTotal;
  </script>
</body>
</html>
